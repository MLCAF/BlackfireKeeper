name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Verify release tag matches code version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; from bk2.version import VERSION_TAG; assert os.environ['GITHUB_REF_NAME'] == VERSION_TAG, 'Git tag differs from bk2/version.py'"
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest discover -s tests -t . -v
